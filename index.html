<!DOCTYPE html>
<html lang="zh-cmn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="shortcut icon" href="k5web.png" type="image/png" />
  <title>K5Web</title>
  <meta name="description" content="一款 K5/K6 在线写频工具，使用应第一时间备份配置及校准数据，提供信道管理、设置管理、备份还原、固件升级等功能。"/>
  <meta name="keywords" content="k5web,uv-k5,uv-k6,chirp,k5,k6">
  <script>
    // 主题首屏引导：必须在任何 CSS 渲染前同步执行，避免深色系统下白屏闪烁。
    // 优先级：用户手动切换过的偏好（localStorage 'arco-theme'，由 navbar useDark 写入）
    //         > 系统配色（prefers-color-scheme）。
    // html[theme-mode=dark] 覆盖 TDesign 组件；body[arco-theme=dark] 覆盖 Arco 组件，
    // body 就绪前先用 html 标记 + 下方内联样式兜住首屏遮罩。
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem('arco-theme'); } catch (e) {}
        // 系统深色判定：k5-bridge.js 注入的原生标记（__K5_SYSTEM_DARK__，APK 内更可靠）
        // 优先，否则用 prefers-color-scheme。
        var sysDark = typeof window.__K5_SYSTEM_DARK__ === 'boolean'
          ? window.__K5_SYSTEM_DARK__
          : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = stored === 'dark' || ((stored === null || stored === '') && sysDark);
        if (dark) {
          document.documentElement.setAttribute('theme-mode', 'dark');
          window.__K5_BOOT_DARK__ = true;
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    html[theme-mode='dark'] { color-scheme: dark; }
  </style>
  <style>
    ::-webkit-scrollbar {
      width: 12px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      border: 4px solid transparent;
      background-clip: padding-box;
      border-radius: 7px;
      background-color: var(--color-text-4);
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-text-3);
    }
  </style>
  <style>
    #loading-mask {
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: #fff;
      user-select: none;
      z-index: 9999;
      overflow: hidden;
    }

    /* 深色首屏：跟随引导脚本设置的 html[theme-mode=dark]，不依赖后续 bundle CSS */
    html[theme-mode='dark'] #loading-mask {
      background: #17171a;
    }

    html[theme-mode='dark'] #loading-mask .loading-dot i {
      background-color: #3a7fff;
    }

    .loading-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
    }

    .loading-dot {
      animation: antRotate 1.2s infinite linear;
      transform: rotate(45deg);
      position: relative;
      display: inline-block;
      font-size: 64px;
      width: 64px;
      height: 64px;
      box-sizing: border-box;
    }

    .loading-dot i {
      width: 22px;
      height: 22px;
      position: absolute;
      display: block;
      background-color: #1890ff;
      border-radius: 100%;
      transform: scale(0.75);
      transform-origin: 50% 50%;
      opacity: 0.3;
      animation: antSpinMove 1s infinite linear alternate;
    }

    .loading-dot i:nth-child(1) {
      top: 0;
      left: 0;
    }

    .loading-dot i:nth-child(2) {
      top: 0;
      right: 0;
      -webkit-animation-delay: 0.4s;
      animation-delay: 0.4s;
    }

    .loading-dot i:nth-child(3) {
      right: 0;
      bottom: 0;
      -webkit-animation-delay: 0.8s;
      animation-delay: 0.8s;
    }

    .loading-dot i:nth-child(4) {
      bottom: 0;
      left: 0;
      -webkit-animation-delay: 1.2s;
      animation-delay: 1.2s;
    }

    @keyframes antRotate {
      to {
        -webkit-transform: rotate(405deg);
        transform: rotate(405deg);
      }
    }

    @-webkit-keyframes antRotate {
      to {
        -webkit-transform: rotate(405deg);
        transform: rotate(405deg);
      }
    }

    @keyframes antSpinMove {
      to {
        opacity: 1;
      }
    }

    @-webkit-keyframes antSpinMove {
      to {
        opacity: 1;
      }
    }
  </style>
  <script src="serial.js"></script>
</head>

<body>
  <script>
    // body 就绪即同步主题属性，保证首帧 DOM 就是暗色（Arco 组件按 body[arco-theme] 取变量）。
    (function () {
      try {
        if (window.__K5_BOOT_DARK__) {
          document.body.setAttribute('arco-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <div id="app">
    <div id="loading-mask">
      <div class="loading-wrapper">
        <span class="loading-dot loading-dot-spin"><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    (async ()=>{
      let wakeLock = null;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch {}
      document.addEventListener("visibilitychange", async () => {
        if (wakeLock !== null && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      });
    })();
  </script>
</body>

</html>
